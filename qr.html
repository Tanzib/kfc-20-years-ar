<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e4002b" />
    <title>Create the AR QR code</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f5;color:#111;font:16px/1.45 Arial,sans-serif}.card{width:min(100%,520px);padding:28px;border-radius:22px;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.12)}h1{margin:0 0 8px;font-size:1.7rem}p{color:#555}label{display:block;margin:22px 0 8px;font-weight:700}input{width:100%;min-height:48px;padding:0 14px;border:1px solid #bbb;border-radius:10px;font-size:1rem}button{min-height:48px;margin-top:12px;padding:0 18px;border:0;border-radius:999px;background:#e4002b;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#111}.actions{display:flex;gap:10px;flex-wrap:wrap}#qr{display:grid;place-items:center;min-height:280px;margin-top:22px;padding:18px;border:1px solid #ddd;border-radius:16px}#qr img,#qr canvas{max-width:100%;height:auto}small{display:block;margin-top:12px;color:#777}.back{display:inline-block;margin-top:18px;color:#e4002b;font-weight:700;text-decoration:none}
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Create your QR code</h1>
      <p>Paste the final GitHub Pages link for the camera experience.</p>
      <label for="url">Experience URL</label>
      <input id="url" type="url" inputmode="url" placeholder="https://username.github.io/repository/" />
      <div class="actions">
        <button id="generate" type="button">Generate QR</button>
        <button id="download" class="secondary" type="button" disabled>Download PNG</button>
      </div>
      <div id="qr" aria-live="polite">Your QR code will appear here.</div>
      <small>This helper loads the QR library from cdnjs. Internet access is required.</small>
      <a class="back" href="./">← Return to experience</a>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
      const input=document.querySelector('#url'),box=document.querySelector('#qr'),download=document.querySelector('#download');
      if(location.protocol.startsWith('http')) input.value=new URL('./',location.href).href;
      function make(){const value=input.value.trim();if(!/^https:\/\//i.test(value)){box.textContent='Please enter the complete HTTPS link.';download.disabled=true;return}box.textContent='';new QRCode(box,{text:value,width:1024,height:1024,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});download.disabled=false}
      document.querySelector('#generate').addEventListener('click',make);
      download.addEventListener('click',()=>{const canvas=box.querySelector('canvas');const image=box.querySelector('img');const source=canvas?.toDataURL('image/png')||image?.src;if(!source)return;const link=document.createElement('a');link.download='kfc-20-years-ar-qr.png';link.href=source;link.click()});
    </script>
  </body>
</html>
